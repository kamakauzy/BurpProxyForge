name: Build and Release ProxyForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxyforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build jar and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ProxyForge
        run: ./gradlew --no-daemon clean fatJar test

      - name: Upload ProxyForge jar
        uses: actions/upload-artifact@v4
        with:
          name: ProxyForge-${{ github.sha }}
          path: build/libs/ProxyForge.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: ProxyForge-${{ github.sha }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ProxyForge.jar
          generate_release_notes: true
