changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - github-actions

  categories:
    - title: Breaking changes
      labels:
        - breaking

    - title: Features
      labels:
        - feature

    - title: Fixes
      labels:
        - bug

    - title: Maintenance
      labels:
        - maintenance
        - dependencies
        - chore
        - refactor

    - title: Documentation
      labels:
        - docs

    - title: Other changes
      labels:
        - '*'
